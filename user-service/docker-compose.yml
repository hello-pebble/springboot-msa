name: springbootSNS

services:
  postgres:
    image: postgres:17
    container_name: snsdb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: snsdb
      POSTGRES_USER: sns
      POSTGRES_PASSWORD: sns
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sns -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 3

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://userdb:5432/snsdb
      - SPRING_DATASOURCE_USERNAME=sns
      - SPRING_DATASOURCE_PASSWORD=sns
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

